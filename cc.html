<title>Country Club</title>
<!--
  VERSION: CC-FRONTDOOR v2026.09.02-35  (v35: Engine-room status was rendering inside a display:none .msg container — visible now; Member directory shows the three per-sport SEEDS (Padel/Tennis/Squash), dead “Current” column retired)  (v34: Engine room routes through cc_admin v5’s PIN-gated recompute action — the engine clones have no CORS and were unreachable from the browser — with honest per-sport status lines)  (v33: ENGINE ROOM — per-sport Recompute buttons + Recompute-all in the Office admin, firing the engine clones directly with {club_id}; ends the edit-a-match-to-recompute workaround)  (v32: REGISTRATION DESK — Register-one-member card with three per-sport seed inputs (gender fills player defaults 1500/1300; a cleared box = non-player default 1300/1200) and the five-column bulk paste Name, Gender, Padel, Tennis, Squash with blanks kept; REL → g21 replicas with shim seed WRITE mapping)  (v31: padel plaque replay bases on seed_padel via PostgREST alias; REL → g20 replicas serving per-sport seeds through the shim)  (v30: veils lock page overflow on arrival and departure — scrollbar centre-shift jiggle gone; REL → g19 replicas: same overflow lock + Control-Room session PIN survives refresh)  (v29: ARRIVAL VEIL — returns from replicas land in branded green until the destination view stands, lifted by render(); Ratings/Tournaments buttons sized to fit the three-across cards; Recent Matches now the family’s expandable rows — tap for per-set pills in the discipline colour + Sets · Games, exactly as OPR/OTR/OSR do)  (g19: STALENESS GUARD — page probes the live repo for the current VSTAMP and re-enters itself once through a stamped URL when older, so bookmarked/unstamped entries can never pin a stale build; FRONT-DOOR DRESSING — the three disciplines in one line on wide screens, Recent Matches across all three sports beneath with a discipline pill per row)  (g18: silent-unlock RACE fixed — the parallel roster render can no longer paint the PIN gate over an in-flight admin return; name-blink fixed — last known club name painted from localStorage before the fetch; on-page banner stamp now tracks the build)  (g17: DEPARTURE VEIL on every sport-card / Control-Room / profile hop — branded green shown on click, before navigation, matching the replicas’ veils end-to-end)  (g16: REL bumped; club name handed to the replicas’ branded veils via sessionStorage)  (g15 sport cards: full-width + Enter Score, then Ratings | Tournaments buttons deep-linking into the replicas via ?view=ratings / ?view=tournaments; "Standings & more" and goSport removed — the front door never links to a replica home page)  (silent admin return; member directory in the Office; pill back-link; secondary button renamed; rebuild card removed)  (?member= opens that member's honour board — replica back buttons land here)  (padel plaque computed by the family's v44 single-source algorithm: seed + replayed match deltas, pairs expanded via member links — no dependency on any write-back column)  (dynamic member search on Profiles)  (admin: per-discipline Rebuild ratings buttons)  (deep links: plaques open the member INSIDE the replica; sport cards offer direct +Score)  (SLIM FRONT DOOR: identity + honour board + admin. Entry/stats/reporting live in the three family replicas — cc-padel.html / cc-tennis.html / cc-squash.html — per the replica architecture.)
  COUNTRY CLUB (CC) · single front door · one club register, three disciplines.
  URL pattern: cc.html?club=1 (one file serves every country club — the header
  reads the club's name from cc_clubs, so "Farland Country Club" is just data).
  Padel scored by the OPR engine leg, tennis by OTR's, squash by OSR's — via
  cc_submit_match -> cc_recompute_<discipline>. Reads cc_ tables ONLY.
  Lives against the OSR Supabase project ADDRESS; OSR itself is never touched.
  v1 scope: sport picker · score entry · standings · recent matches · unified
  profile (three-tile honour board) · admin (club/members/pairs/corrections).
  Ladders and tournaments intentionally excluded from v1.
-->
<style>
:root{
  --club:#1B3B2F;        /* clubhouse green */
  --club-deep:#122A21;
  --linen:#F2EDE0;       /* cream */
  --linen-2:#E9E1CE;
  --brass:#C9A44C;       /* brass accent */
  --ink:#1E2B24;
  --padel:#6C3483;       /* parent app colours — one club, three engines */
  --tennis:#2E7D4F;
  --squash:#A93226;
  --ok:#2E7D4F; --bad:#A93226;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:var(--linen);color:var(--ink);min-height:100vh}
.serif{font-family:Georgia,'Times New Roman',serif}
header{background:var(--club);color:var(--linen);padding:18px 16px 14px;text-align:center;border-bottom:3px solid var(--brass)}
header h1{font-family:Georgia,serif;font-weight:700;font-size:1.45rem;letter-spacing:.5px}
header .sub{font-size:.72rem;letter-spacing:2.5px;text-transform:uppercase;color:var(--brass);margin-top:3px}
nav{display:flex;background:var(--club-deep);position:sticky;top:0;z-index:5}
nav button{flex:1;background:none;border:none;color:#cfd8d2;padding:11px 2px;font-size:.8rem;cursor:pointer;border-bottom:3px solid transparent}
nav button.on{color:var(--linen);border-bottom-color:var(--brass);font-weight:600}
main{max-width:640px;margin:0 auto;padding:14px 12px 60px}
.card{background:#fff;border:1px solid var(--linen-2);border-radius:10px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
h2{font-family:Georgia,serif;font-size:1.05rem;margin-bottom:10px;color:var(--club)}
h3{font-size:.9rem;margin:10px 0 6px;color:var(--club)}
label{display:block;font-size:.75rem;color:#5c6b62;margin:8px 0 3px}
select,input[type=text],input[type=number],input[type=date],input[type=password]{width:100%;padding:9px;border:1px solid #cfc7b2;border-radius:7px;font-size:.95rem;background:#fff}
.row{display:flex;gap:8px}.row>*{flex:1}
button.btn{width:100%;padding:12px;border:none;border-radius:8px;background:var(--club);color:var(--linen);font-size:1rem;font-weight:600;cursor:pointer;margin-top:12px}
button.btn:disabled{opacity:.5}
button.mini{padding:6px 10px;border:1px solid #cfc7b2;background:#fff;border-radius:6px;font-size:.78rem;cursor:pointer}
.sport-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:6px}
@media(min-width:720px){.sport-grid{grid-template-columns:repeat(3,1fr)}}
.sport-card{border:none;border-radius:12px;padding:20px 16px;color:#fff;cursor:pointer;text-align:left;position:relative;overflow:hidden}
.sport-card .nm{font-family:Georgia,serif;font-size:1.35rem;font-weight:700}
.sport-card .eng{font-size:.7rem;letter-spacing:1.5px;text-transform:uppercase;opacity:.85;margin-top:3px}
.sport-card.padel{background:linear-gradient(135deg,var(--padel),#4A235A)}
.sport-card.tennis{background:linear-gradient(135deg,var(--tennis),#1D5433)}
.sport-card.squash{background:linear-gradient(135deg,var(--squash),#78231A)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.68rem;font-weight:700;letter-spacing:.5px;color:#fff}
.pill.padel{background:var(--padel)}.pill.tennis{background:var(--tennis)}.pill.squash{background:var(--squash)}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th{color:#5c6b62;font-weight:600;text-align:left;padding:6px 4px;border-bottom:2px solid var(--linen-2);font-size:.72rem;text-transform:uppercase;letter-spacing:.5px}
td{padding:7px 4px;border-bottom:1px solid var(--linen-2)}
tr.tap{cursor:pointer}tr.tap:active{background:var(--linen)}
.muted{color:#8a9790;font-size:.78rem}
.msg{padding:10px;border-radius:8px;font-size:.85rem;margin-top:10px;display:none}
.msg.ok{display:block;background:#E3EFE7;color:#1D5433}.msg.err{display:block;background:#F5E1DE;color:#78231A}
.board{display:grid;grid-template-columns:1fr;gap:10px;margin-top:8px}
.plaque{border-radius:10px;padding:12px 14px;color:#fff;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.plaque.padel{background:linear-gradient(135deg,var(--padel),#4A235A)}
.plaque.tennis{background:linear-gradient(135deg,var(--tennis),#1D5433)}
.plaque.squash{background:linear-gradient(135deg,var(--squash),#78231A)}
.plaque .d{font-size:.7rem;letter-spacing:1.5px;text-transform:uppercase;opacity:.85}
.plaque .r{font-family:Georgia,serif;font-size:1.5rem;font-weight:700}
.plaque .side{text-align:right;font-size:.78rem;line-height:1.5}
.mv.up{color:#B9E4C4}.mv.dn{color:#F3C1B8}
.back{background:none;border:none;color:var(--club);font-size:.85rem;cursor:pointer;padding:4px 0;margin-bottom:8px}
.delta{font-weight:700}.delta.up{color:var(--ok)}.delta.dn{color:var(--bad)}
.setline{font-size:.74rem;color:#8a9790}
.gate{margin:8px 0}
</style>
</head>
<body>
<script>
/* v29 ARRIVAL VEIL: any entry carrying replica params (?member= / ?view=admin / ?r=) is a
   RETURN journey — paint the branded green before the shell can flash, lifted by render()
   the moment the destination view stands (8s failsafe so the page can never stay covered). */
(function(){ try{
  var q=location.search||"";
  if(!(/[?&](member|view|r)=/.test(q))) return;
  var cid=(q.match(/[?&]club=(\d+)/)||[])[1]||"1";
  var cn=""; try{ cn=localStorage.getItem("cc_name_"+cid)||""; }catch(e){}
  var esc=function(x){ return String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;"); };
  var v=document.createElement("div"); v.id="ccArriveVeil";
  v.style.cssText="position:fixed;inset:0;z-index:99999;background:#1B3B2F;display:flex;align-items:center;justify-content:center";
  v.innerHTML='<div style="text-align:center;color:#F2EDE0;font-family:Georgia,\'Times New Roman\',serif">'
    +'<div style="font-size:27px;font-weight:700;letter-spacing:.5px;margin-bottom:6px">'+esc(cn||"Country Club")+'</div>'
    +'<div style="font-size:11px;letter-spacing:3px;color:#C9A44C;text-transform:uppercase;margin-bottom:22px">One club · Three disciplines</div>'
    +'<div style="width:26px;height:26px;margin:0 auto;border:3px solid rgba(201,164,76,.25);border-top-color:#C9A44C;border-radius:50%;animation:ccspin .9s linear infinite"></div></div>';
  var st=document.createElement("style"); st.textContent="@keyframes ccspin{to{transform:rotate(360deg)}}";
  v.appendChild(st); document.body.appendChild(v);
  document.documentElement.style.overflow="hidden";   /* v30: no scrollbar while veiled = no centre-shift jiggle */
  setTimeout(function(){ var e=document.getElementById("ccArriveVeil"); if(e){ e.remove(); document.documentElement.style.overflow=""; } }, 8000);
}catch(e){} })();
</script>
<header>
  <h1 id="clubName" class="serif">Country Club</h1>
  <div class="sub">One club · Three disciplines · One rating home</div>
  <div style="font-size:.62rem;color:#7a917f;margin-top:4px;letter-spacing:1px">v2026.09.02-35</div>
</header>
<nav id="nav">
  <button data-v="home" class="on">Home</button>
  <button data-v="profile">Profiles</button>
  <button data-v="admin">Admin</button>
</nav>
<main id="main"></main>

<script>
"use strict";
/* ================= CONFIG (CC lives at the OSR project ADDRESS only) ============ */
var SB_URL="https://djmbnvikrdgnomjhtkgf.supabase.co";
var SB_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRqbWJudmlrcmRnbm9tamh0a2dmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzOTE0MzEsImV4cCI6MjEwMDk2NzQzMX0.vR8xlVFjV6jXW-pAclGjM74HqmWSKVpsacFjM-dCIJI";
var CID=(function(){ var m=(location.search||"").match(/[?&]club=(\d+)/); return m?parseInt(m[1],10):1; })();
var DISCS=["padel","tennis","squash"];
var REL="g21";  // replica release stamp — bump with each replica build; busts every cache layer
var VSTAMP="v2026.09.02-35";  // build stamp — MUST match the banner div and the VERSION header every build
/* g19 STALENESS GUARD: bookmarks open this page UNSTAMPED, and GitHub Pages lets browsers
   keep that URL for ~10 minutes — so every deploy looked dead on arrival. On load, quietly
   probe the live file (cache-bypassed) for its VSTAMP; if this page is older, re-enter once
   through a stamped URL. One-shot per target build (sessionStorage), so it can never loop. */
(function(){
  try{
    fetch(location.pathname+"?probe="+Date.now(),{cache:"no-store"})
      .then(function(r){ return r.ok ? r.text() : ""; })
      .then(function(t){
        var m=t.match(/var VSTAMP="([^"]+)"/);
        if(!m || m[1]===VSTAMP) return;
        if(sessionStorage.getItem("cc_reloaded_to")===m[1]) return;
        sessionStorage.setItem("cc_reloaded_to", m[1]);
        var u=new URL(location.href); u.searchParams.set("r", m[1]);
        location.replace(u.toString());
      }).catch(function(){});
  }catch(e){}
})();
var DLABEL={padel:"Padel",tennis:"Tennis",squash:"Squash"};
var DENGINE={padel:"OPR engine",tennis:"OTR engine",squash:"OSR engine"};

/* ================= DATA HELPERS ================= */
function rest(path){ return fetch(SB_URL+"/rest/v1/"+path,{headers:{apikey:SB_ANON,Authorization:"Bearer "+SB_ANON}}).then(function(r){return r.json();}); }
function fn(name,body){ return fetch(SB_URL+"/functions/v1/"+name,{method:"POST",headers:{apikey:SB_ANON,Authorization:"Bearer "+SB_ANON,"Content-Type":"application/json"},body:JSON.stringify(body)}).then(function(r){return r.json();}); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function lvl(r){ return (r==null)?"–":(Math.round(r/200*10)/10).toFixed(1); }
function mv(cur,init){ if(cur==null||init==null)return null; return Math.round(cur-init); }
function mvHtml(m){ if(m==null)return '<span class="muted">–</span>'; var s=m>=0?"+":""; return '<span class="mv '+(m>=0?"up":"dn")+'">'+s+m+'</span>'; }
function today(){ var d=new Date(); return d.toISOString().slice(0,10); }
function typeFromGenders(gs){ var m=0,f=0; gs.forEach(function(g){ if(g==="M")m++; else if(g==="F")f++; }); if(m>0&&f===0)return "Men's"; if(f>0&&m===0)return "Ladies"; return "Mixed"; }
function pairTypeLabel(g){ return g==="M"?"Men's":(g==="L"?"Ladies":"Mixed"); }

/* ================= STATE ================= */
var S={view:"home",disc:null,members:[],pairs:[],club:null,profName:null,profDisc:null,adminPin:"",adminOpen:false,adminClub:null,adminMaster:false,adminClubs:[]};

/* ================= BOOT ================= */
var MEMBER_PARAM=(function(){ var m=(location.search||"").match(/[?&]member=([^&]+)/); return m?decodeURIComponent(m[1]):null; })();
var ADMIN_RETURN=/[?&]view=admin(&|$)/.test(location.search||"");
function boot(){
  // g18 NAME-BLINK FIX: the static header says "Country Club" until the database answers,
  // so every refresh blinked Country Club → demo. Paint the LAST KNOWN name for this club
  // immediately (localStorage, per club id); the fetch below refreshes and re-caches it.
  try{
    var _cn=localStorage.getItem("cc_name_"+CID);
    if(_cn){ document.getElementById("clubName").textContent=_cn; sessionStorage.setItem("cc_club_name",_cn); }
  }catch(e){}
  rest("cc_clubs?id=eq."+CID+"&select=id,name").then(function(rows){
    S.club=(rows&&rows[0])||null;
    document.getElementById("clubName").textContent=S.club?S.club.name:"Country Club (club "+CID+" not found)";
    // g16: hand the club name to the replicas' branded veils (session only, never in a URL)
    try{ if(S.club&&S.club.name){ sessionStorage.setItem("cc_club_name", S.club.name); localStorage.setItem("cc_name_"+CID, S.club.name); } }catch(e){}
  });
  if(ADMIN_RETURN){
    S.view="admin";
    Array.prototype.forEach.call(document.querySelectorAll("#nav button"),function(x){x.classList.toggle("on",x.getAttribute("data-v")==="admin");});
    var op=null; try{ op=sessionStorage.getItem("cc_office_pin"); }catch(e){}
    if(op){
      // g18: mark the silent unlock IN FLIGHT so the parallel roster load cannot stomp
      // this screen with the locked gate (that was the gate flash on every admin return).
      S._silentUnlock=true;
      document.getElementById("main").innerHTML='<div class="card" style="text-align:center;padding:38px 16px">'
        +'<div style="width:26px;height:26px;margin:0 auto 14px;border:3px solid rgba(201,164,76,.35);border-top-color:#C9A44C;border-radius:50%;animation:ccspin .9s linear infinite"></div>'
        +'<div class="muted">Opening admin…</div><style>@keyframes ccspin{to{transform:rotate(360deg)}}</style></div>';
      aUnlock(op);
      // failsafe: if the PIN no longer verifies (changed/revoked), fall back to the gate.
      setTimeout(function(){ if(S._silentUnlock && !S.adminOpen){ S._silentUnlock=false; render(); } }, 8000);
    } else { render(); }
  } else if(MEMBER_PARAM){
    S.view="profile"; S.profName=MEMBER_PARAM;
    Array.prototype.forEach.call(document.querySelectorAll("#nav button"),function(x){x.classList.toggle("on",x.getAttribute("data-v")==="profile");});
    document.getElementById("main").innerHTML='<div class="card"><div class="muted">Opening profile…</div></div>';
  } else { render(); }
  loadRoster().then(function(){
    if(MEMBER_PARAM && !S.members.some(function(x){return x.full_name===MEMBER_PARAM;})){ S.view="home"; S.profName=null; }
    if(S._silentUnlock && !S.adminOpen) return;   // g18: afterUnlock() renders when ready
    render();
  });
}
function loadRoster(){
  return Promise.all([
    rest("cc_individuals?club_id=eq."+CID+"&select=id,full_name,gender,seed_rating,current_rating,seed_padel,seed_tennis,seed_squash&order=full_name"),
    rest("cc_players?club_id=eq."+CID+"&discipline=eq.padel&select=id,name,gender,member_a_id,member_b_id&order=name")
  ]).then(function(res){ S.members=res[0]||[]; S.pairs=res[1]||[]; });
}
document.getElementById("nav").addEventListener("click",function(e){
  var b=e.target.closest("button"); if(!b)return;
  S.view=b.getAttribute("data-v"); S.profName=null; S.profDisc=null;
  Array.prototype.forEach.call(document.querySelectorAll("#nav button"),function(x){x.classList.toggle("on",x===b);});
  render();
});

/* ================= RENDER ROUTER ================= */
function ccArriveLift(){ try{ var e=document.getElementById("ccArriveVeil"); if(e) e.remove(); document.documentElement.style.overflow=""; }catch(x){} }
function render(){
  var m=document.getElementById("main");
  if(S.view==="home"){ vHome(m); ccArriveLift(); return; }
  if(S.view==="profile"){ vProfile(m); ccArriveLift(); return; }
  if(S.view==="admin"){ vAdmin(m); ccArriveLift(); return; }
}

/* ================= HOME — the sport picker ================= */
function vHome(m){
  var h='<div class="card"><h2>Select your discipline</h2><div class="sport-grid">';
  DISCS.forEach(function(d){
    h+='<div class="sport-card '+d+'" style="cursor:default">'
      +'<div class="nm">'+DLABEL[d]+'</div><div class="eng">'+DENGINE[d]+'</div>'
      +'<div style="margin-top:14px">'
      +'<button onclick="goEnter(event,\''+d+'\')" style="width:100%;background:rgba(255,255,255,.92);color:#1B3B2F;border:none;padding:12px 8px;border-radius:9px;font-size:.95rem;font-weight:800;cursor:pointer">+ Enter Score</button>'
      +'</div>'
      +'<div style="display:flex;gap:10px;margin-top:10px">'
      +'<button onclick="goView(\''+d+'\',\'ratings\')" style="flex:1;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.5);padding:10px 2px;border-radius:9px;font-size:.76rem;font-weight:600;cursor:pointer;white-space:nowrap">Ratings</button>'
      +'<button onclick="goView(\''+d+'\',\'tournaments\')" style="flex:1;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.5);padding:10px 2px;border-radius:9px;font-size:.76rem;font-weight:600;cursor:pointer;white-space:nowrap">Tournaments</button>'
      +'</div></div>';
  });
  h+='</div></div>';
  h+='<div class="card"><h2>Recent Matches</h2><div id="ccRecent"><div class="muted">Loading…</div></div></div>';
  h+='<div class="card"><div class="muted">Register once, play everything. Every member holds one profile across all three sports — open <b>Profiles</b> to see the honour board.</div></div>';
  m.innerHTML=h;
  loadRecentMatches();
}
/* v29 RECENT MATCHES — the family pattern ported faithfully (read from the OPR/OTR/OSR
   forks): each row is EXPANDABLE — header (discipline pill · date · type · caret), the
   two sides with the set score in gold, and on tap the per-set scores as pills in the
   discipline’s colour plus the Sets · Games line, exactly as the three parents do.
   set_scores lives on the match row itself ("6-3,6-4") — no lookup needed. Padel rows
   carry pair names (display_t1/t2 or slot 1); tennis/squash join two individuals. */
var DCOLOR={padel:"var(--padel)",tennis:"var(--tennis)",squash:"var(--squash)"};
function loadRecentMatches(){
  var box=document.getElementById("ccRecent"); if(!box) return;
  if(S._recent){ box.innerHTML=recentHTML(S._recent); return; }
  rest("cc_matches?club_id=eq."+CID+"&select=discipline,match_date,match_type,event,t1p1,t1p2,t2p1,t2p2,t1_sets,t2_sets,t1_games,t2_games,set_scores,display_t1,display_t2&order=match_date.desc,id.desc&limit=10")
    .then(function(rows){ S._recent=rows||[]; var b=document.getElementById("ccRecent"); if(b) b.innerHTML=recentHTML(S._recent); })
    .catch(function(){ var b=document.getElementById("ccRecent"); if(b) b.innerHTML='<div class="muted">Could not load recent matches.</div>'; });
}
function recentHTML(rows){
  if(!rows.length) return '<div class="muted">No matches yet — the first result will appear here.</div>';
  function side(dsp,a,b){ return dsp?esc(dsp):(b?(esc(a)+' & '+esc(b)):esc(a||'')); }
  var h='';
  rows.forEach(function(r,idx){
    var ev=(r.event||'').trim().toLowerCase();
    var tag = ev==='ladder match' ? '<span style="background:#c4e000;color:#2a3000;font-size:.6rem;font-weight:700;padding:1px 5px;border-radius:4px">L</span>'
            : (ev && ev!=='social') ? '<span style="background:#6c3483;color:#fff;font-size:.6rem;font-weight:700;padding:1px 5px;border-radius:4px">T</span>'
            : '<span style="background:#ccc;color:#333;font-size:.6rem;font-weight:700;padding:1px 5px;border-radius:4px">S</span>';
    h+='<div onclick="ccToggleRecent('+idx+')" style="cursor:pointer;padding:9px 2px;border-bottom:1px solid var(--linen-2)">'
      +'<div style="display:flex;align-items:center;gap:8px">'
      +'<span class="pill '+esc(r.discipline)+'">'+esc(DLABEL[r.discipline]||r.discipline)+'</span>'
      +'<span class="muted" style="font-size:.7rem">'+esc(r.match_date||'')+'</span>'

function submitScore(){
  var d=S.disc, msg=document.getElementById("emsg");
  msg.className="msg";

  var t1g=parseInt(val("t1g"),10), t2g=parseInt(val("t2g"),10);
  if(isNaN(t1s)||isNaN(t2s)||isNaN(t1g)||isNaN(t2g)){ msg.className="msg err"; msg.textContent="All four score numbers are required."; return; }
  var match={ match_date:val("mdate"), event:"Social", set_scores:val("mset"),
    t1_sets:t1s, t2_sets:t2s, t1_games:t1g, t2_games:t2g };
  if(d==="padel"){
    var n1p=val("p_t1"), n1q=val("p_t1b"), n2p=val("p_t2"), n2q=val("p_t2b");
    var need4=[n1p,n1q,n2p,n2q];
    if(need4.some(function(x){return !x;})){ msg.className="msg err"; msg.textContent="Choose all four players."; return; }
    var u={}; var dup4=false; need4.forEach(function(x){ if(u[x])dup4=true; u[x]=1; });
    if(dup4){ msg.className="msg err"; msg.textContent="The same member is selected twice."; return; }
    match.t1p1=n1p; match.t1p2=n1q; match.t2p1=n2p; match.t2p2=n2q;
    match.match_format="doubles";
  } else {
    var dbl=(S.fmt==="doubles");
    var n1=val("p_t1"), n2=val("p_t2"), n1b=dbl?val("p_t1b"):null, n2b=dbl?val("p_t2b"):null;
    var need=dbl?[n1,n1b,n2,n2b]:[n1,n2];
    if(need.some(function(x){return !x;})){ msg.className="msg err"; msg.textContent="Choose all players."; return; }
    var uniq={}; var dup=false; need.forEach(function(x){ if(uniq[x])dup=true; uniq[x]=1; });
    if(dup){ msg.className="msg err"; msg.textContent="The same member is selected twice."; return; }
    match.t1p1=n1; match.t1p2=n1b; match.t2p1=n2; match.t2p2=n2b;
    match.match_format=dbl?"doubles":"singles";
    var gs=need.map(function(n){ var r=S.members.find(function(x){return x.full_name===n;}); return r?r.gender:""; });
    match.match_type=typeFromGenders(gs);
  }
  var payload={ club_id:CID, discipline:d, submitter:val("msub"), pin:"", match:match };
  msg.className="msg ok"; msg.textContent="Saving…";
  fn("cc_submit_match",payload).then(function(r){
    if(r&&r.ok){ msg.className="msg ok"; msg.textContent="Match saved — ratings are rebuilding now."; }
    else { msg.className="msg err"; msg.textContent=(r&&r.error)||"Could not save."; }
  }).catch(function(e){ msg.className="msg err"; msg.textContent=String(e); });
}

function vProfileBoard(m){
  var nm=S.profName;
  var me=S.members.find(function(x){return x.full_name===nm;})||{};
  m.innerHTML='<button onclick="backToList()" style="background:var(--club);color:var(--linen);border:1px solid var(--brass);padding:8px 16px;border-radius:99px;font-size:.85rem;font-weight:600;cursor:pointer;margin-bottom:10px">‹ All members</button>'
    +'<div class="card"><h2 class="serif">'+esc(nm)+'</h2><div class="muted">The honour board — one member, three disciplines. Tap a plaque to open that sport\'s full app for the complete profile.</div>'
    +'<div class="board" id="board">Loading…</div></div>';
  // ONE SYSTEM, THREE SPORTS: every plaque reads the engine-written
  // cc_player_results rows — padel included (the OPR engine writes
  // per-individual rows there too; it is what the padel replica's own
  // profile header shows). Individuals present but unrated fall back
  // to their register rating with move 0.
  Promise.all([
    rest("cc_individuals?club_id=eq."+CID+"&select=id,full_name,seed_rating:seed_padel"),   /* v31: padel plaque replay bases on the PADEL seed */
    rest("cc_players?club_id=eq."+CID+"&discipline=eq.padel&select=name,member_a_id,member_b_id"),
    rest("cc_matches?club_id=eq."+CID+"&discipline=eq.padel&select=t1p1,t2p1,rating_delta&order=match_date.asc,id.asc"),
    rest("cc_player_results?club_id=eq."+CID+"&discipline=eq.tennis&select=name,current_rating,initial_rating&order=current_rating.desc"),
    rest("cc_player_results?club_id=eq."+CID+"&discipline=eq.squash&select=name,current_rating,initial_rating&order=current_rating.desc")
  ]).then(function(rr){
    var rows=[{d:"padel"},{d:"tennis"},{d:"squash"}];
    // PADEL — the family's v44 single-source replay: seed + own per-match deltas,
    // pair sides expanded to their two members via the member links.
    (function(){
      var inds=rr[0]||[], pairs=rr[1]||[], ms=rr[2]||[];
      var seed={}, idName={};
      inds.forEach(function(i){ seed[i.full_name]=(i.seed_rating!=null?+i.seed_rating:1500); idName[i.id]=i.full_name; });
      var members={};
      pairs.forEach(function(p2){ if(p2.member_a_id!=null&&p2.member_b_id!=null){ var a=idName[p2.member_a_id], b=idName[p2.member_b_id]; if(a&&b) members[p2.name]=[a,b]; } });
      var cur={}; Object.keys(seed).forEach(function(k){ cur[k]=seed[k]; });
      var membersOf=function(pn){ return members[pn]||[pn]; };
      ms.forEach(function(m2){ var d=(m2.rating_delta!=null?+m2.rating_delta:0);
        membersOf(m2.t1p1).forEach(function(x){ if(x in cur) cur[x]+=d; });
        membersOf(m2.t2p1).forEach(function(x){ if(x in cur) cur[x]-=d; }); });
      var list=Object.keys(cur).map(function(k){ return {name:k, r:Math.round(cur[k])}; })
        .sort(function(a,b){ return b.r-a.r; });
      var row=rows[0]; row.n=list.length;
      list.forEach(function(r,idx){ if(r.name===nm){ row.rank=idx+1; row.cur=r.r; row.move=Math.round(r.r-(seed[nm]!=null?seed[nm]:r.r)); } });
      if(row.cur==null){ row.cur=(me.seed_rating!=null)?me.seed_rating:null; row.move=(row.cur!=null)?0:null; }
    })();
    // TENNIS / SQUASH — engine-written per-player results, as before.
    [["tennis",rr[3]||[]],["squash",rr[4]||[]]].forEach(function(pr2,ix){
      var list=pr2[1].filter(function(r){ return String(r.name).indexOf(" & ")<0; });
      var row=rows[ix+1];
      var meR=null;
      list.forEach(function(r,idx){ if(r.name===nm){ meR=r; row.rank=idx+1; } });
      row.n=list.length;
      if(meR){ row.cur=meR.current_rating; row.move=mv(meR.current_rating,meR.initial_rating); }
      else { row.cur=(me.seed_rating!=null)?me.seed_rating:null; row.move=(row.cur!=null)?0:null; row.rank=null; }
    });
    (function(){
      var h="";
      rows.forEach(function(r){
        var cur=(r.cur!=null)?Math.round(r.cur):"–";
        var rk=(r.rank!=null)?("rank "+r.rank+" / "+r.n):"unranked";
        h+='<div class="plaque '+r.d+'" onclick="goProfile(\''+r.d+'\')">'
          +'<div><div class="d">'+DLABEL[r.d]+'</div><div class="r">'+cur+'</div></div>'
          +'<div class="side">level '+lvl(r.cur)+'<br>move '+mvHtml(r.move)+'<br>'+rk+' ›</div></div>';
      });
      document.getElementById("board").innerHTML=h;
    })();
  });
}

function apin(){ return S.adminPin; }
function aUnlock(pinArg){
  var p=pinArg||val("aPin");
  var msg=document.getElementById("aGateMsg")||{className:"",textContent:""};
  if(!p){ msg.className="msg err"; msg.textContent="Enter a PIN."; return; }
  msg.className="msg ok"; msg.textContent="Checking…";
  fn("cc_admin",{action:"list_clubs"}).then(function(r){
    var clubs=(r&&r.clubs)||[];
    // probe the PIN against THIS club first, then every club (a club code
    // identifies its club; the master passes everywhere).
    var probeIds=[CID].concat(clubs.map(function(c){return c.id;}).filter(function(i){return i!==CID;}));
    var i=0;
    function tryNext(){
      if(i>=probeIds.length){ msg.className="msg err"; msg.textContent="PIN not recognised."; return; }
      var id=probeIds[i++];
      fn("cc_admin",{action:"edit_member",club_id:id,admin_pin:p,full_name:"__pin_probe__"}).then(function(rr){
        var e=(rr&&rr.error)||"";
        if(e==="Admin PIN required."){ tryNext(); return; }
        // PIN accepted for this club (any other response passed the gate)
        S.adminPin=p; S.adminOpen=true; S.adminClubs=clubs;
        S.adminClub=clubs.find(function(c){return c.id===id;})||{id:id,name:"Club #"+id};
        // master detection: PIN passes for a SECOND club too (or only one club exists
        // and the probe passed while it is not that club's own stored code — safe
        // fallback: try one other club if present)
        var other=clubs.find(function(c){return c.id!==id;});
        if(other){
          fn("cc_admin",{action:"edit_member",club_id:other.id,admin_pin:p,full_name:"__pin_probe__"}).then(function(r2){
            S.adminMaster=((r2&&r2.error)||"")!=="Admin PIN required.";
            if(!S.adminMaster){ S.adminClubs=[S.adminClub]; }
            afterUnlock();
          });
        } else { S.adminMaster=true; afterUnlock(); }
      });
    }
    tryNext();
  });
}
function afterUnlock(){
  S._silentUnlock=false;   // g18: unlock landed — rendering is safe again
  if(S.adminClub && S.adminClub.id!==CID){
    // the PIN belongs to a different club than the page URL — follow the PIN
    location.search="?club="+S.adminClub.id;
    return;
  }
  render();
}

/* v33 ENGINE ROOM — fires the three engine clones directly; sequential in

/* v34: the engine clones have NO CORS (server-to-server only), so the buttons route
   through cc_admin's PIN-gated "recompute" action (v5). Reporting is now honest:
   one line PER SPORT, accumulated — no more single overwritten line saying

function aEngLine(d,txt,ok){
  var box=document.getElementById("aMsgEng"); if(!box) return;
  box.style.display="block";   // v35: belt-and-braces against any hiding class
  var ln=document.getElementById("aEng_"+d);
  if(!ln){ ln=document.createElement("div"); ln.id="aEng_"+d; box.appendChild(ln); }
  ln.className="msg "+(ok===null?"ok":(ok?"ok":"err")); ln.style.display="block"; ln.textContent=txt;
}
function aRecompute(d){
  aEngLine(d, d.charAt(0).toUpperCase()+d.slice(1)+": recomputing…", null);
  return fn("cc_admin",{action:"recompute",discipline:d,club_id:CID,admin_pin:apin()}).then(function(r){
    var ok=!!(r&&r.ok);
    var detail=(ok&&r.engine&&r.engine.players!=null)?(" ("+r.engine.players+" players)"):"";
    aEngLine(d, d.charAt(0).toUpperCase()+d.slice(1)+": "+(ok?("recomputed"+detail+"."):((r&&r.error)||"failed.")), ok);
    return ok;
  }).catch(function(){ aEngLine(d, d.charAt(0).toUpperCase()+d.slice(1)+": failed (network).", false); return false; });
}
function aRecomputeAll(){
  var box=document.getElementById("aMsgEng"); if(box) box.innerHTML="";
  aRecompute("padel").then(function(a){ return aRecompute("tennis").then(function(b){ return aRecompute("squash").then(function(c){
    var n=(a?1:0)+(b?1:0)+(c?1:0);
    aEngLine("all", (n===3)?"All three sports recomputed.":("Done — "+n+" of 3 succeeded — the failed sport's line shows why."), n===3);
  });});});
}
/* v32 REGISTER ONE MEMBER — the desk's single-entry twin of the bulk paste. */
function aRegDefaults(){
  var g=val("aRegG")||"M", d=(g==="F")?1300:1500;
  ["aRegP","aRegT","aRegS"].forEach(function(id){ var e=document.getElementById(id); if(e) e.value=d; });
}
function aRegOne(){
  var msg=document.getElementById("aMsgR"); msg.className="msg";
  var name=(val("aRegName")||"").trim(), g=val("aRegG")||"M";
  if(!name){ msg.className="msg err"; msg.textContent="Name required."; return; }
  var P=val("aRegP"), T=val("aRegT"), Sq=val("aRegS");
  msg.className="msg ok"; msg.textContent="Registering…";
  fn("cc_admin",{action:"add_member",club_id:CID,admin_pin:apin(),full_name:name,gender:g,
     seed_padel:(P===""?null:Number(P)), seed_tennis:(T===""?null:Number(T)), seed_squash:(Sq===""?null:Number(Sq))
  }).then(function(r){
    if(r&&r.ok){ msg.className="msg ok"; msg.textContent="Registered "+name+"."; document.getElementById("aRegName").value=""; loadRoster().then(render); }
    else { msg.className="msg err"; msg.textContent=(r&&r.error)||"Failed."; }
  });
}
function aBulkAdd(){
  var msg=document.getElementById("aMsgB"); msg.className="msg";
  var raw=val("aBulk");
  var lines=raw.split("\n").map(function(l){return l.trim();}).filter(function(l){return l.length;});
  if(!lines.length){ msg.className="msg err"; msg.textContent="Nothing to add — paste some rows first."; return; }
  var rows=[], errs=[];
  lines.forEach(function(ln,i){
    // v32 FIVE-COLUMN FORMAT: Name, Gender, Padel, Tennis, Squash. Blank rating
    // columns are KEPT (no filtering), so "F, , , 1400" means squash-only — the
    // function gives blanks the non-player default (1300 M / 1200 F).
    var parts=ln.split(/\t|,/).map(function(p){return p.trim();});
    while(parts.length && parts[parts.length-1]==="") parts.pop();
    if(parts.length<2 || !parts[0]){ errs.push("Line "+(i+1)+": need at least Name, Gender."); return; }
    var name=parts[0], gender=(parts[1]||"").toUpperCase().charAt(0);
    if(gender!=="M"&&gender!=="F"){ errs.push("Line "+(i+1)+" ("+name+"): gender must be M or F."); return; }
    rows.push({ full_name:name, gender:gender, padel:parts[2]||null, tennis:parts[3]||null, squash:parts[4]||null });
  });
  if(errs.length){ msg.className="msg err"; msg.innerHTML=errs.map(esc).join("<br>"); return; }
  msg.className="msg ok"; msg.textContent="Adding "+rows.length+" members…";
  fn("cc_admin",{action:"bulk_add_members",club_id:CID,admin_pin:apin(),rows:rows}).then(function(r){
    if(r&&r.ok){
      var t="Added "+r.added+" member"+(r.added===1?"":"s")+".";
      if(r.failed&&r.failed.length){ msg.className="msg err"; msg.textContent=t+" Failed: "+r.failed.join(", "); }
      else { msg.className="msg ok"; msg.textContent=t; document.getElementById("aBulk").value=""; }
      loadRoster().then(render);
    } else { msg.className="msg err"; msg.textContent=(r&&r.error)||"Failed."; }
  });
}
function aDirFilter(){
  var q=(val("aDirSearch")||"").toLowerCase();
  var rows=S.members.filter(function(r){ return !q || r.full_name.toLowerCase().indexOf(q)>=0; });
  var el=document.getElementById("aDir"); if(!el)return;
  if(!rows.length){ el.innerHTML='<span class="muted">No members match.</span>'; return; }
  /* v35: "Current" retired — it was the register's birth-time copy, written once at
     registration and never updated by any engine (live ratings are per-sport in each
     discipline's results; see the honour board). The register's real truth is the
     three per-sport SEEDS, shown here. */
  var h='<table><tr><th>Name</th><th>G</th><th>Padel</th><th>Tennis</th><th>Squash</th></tr>';
  var sd=function(v){ return v!=null?Math.round(v):"–"; };
  rows.forEach(function(r){
    h+='<tr><td>'+esc(r.full_name)+'</td><td>'+esc(r.gender||"")+'</td><td>'+sd(r.seed_padel!=null?r.seed_padel:r.seed_rating)+'</td><td>'+sd(r.seed_tennis!=null?r.seed_tennis:r.seed_rating)+'</td><td>'+sd(r.seed_squash!=null?r.seed_squash:r.seed_rating)+'</td></tr>';
  });
  el.innerHTML=h+'</table>';
}
function aAddClub(){
  var msg=document.getElementById("aMsg4"); msg.className="msg ok"; msg.textContent="Working…";
  fn("cc_admin",{action:"add_club",admin_pin:apin(),name:val("aCn"),club_admin_pin:val("aCp")}).then(function(r){
    if(r&&r.ok){ msg.className="msg ok"; msg.textContent="Created club #"+r.club.id+" — open with ?club="+r.club.id; }
    else { msg.className="msg err"; msg.textContent=(r&&r.error)||"Failed."; }
  });
}

boot();
