<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Country Club</title>
<!--
  VERSION: CC-FRONTDOOR v2026.08.26-18  (Admin = the CLUB OFFICE: clubs, bulk register, rebuild; sport work in each Control Room)  (?member= opens that member's honour board — replica back buttons land here)  (padel plaque computed by the family's v44 single-source algorithm: seed + replayed match deltas, pairs expanded via member links — no dependency on any write-back column)  (dynamic member search on Profiles)  (admin: per-discipline Rebuild ratings buttons)  (deep links: plaques open the member INSIDE the replica; sport cards offer direct +Score)  (SLIM FRONT DOOR: identity + honour board + admin. Entry/stats/reporting live in the three family replicas — cc-padel.html / cc-tennis.html / cc-squash.html — per the replica architecture.)
  COUNTRY CLUB (CC) · single front door · one club register, three disciplines.
  URL pattern: cc.html?club=1 (one file serves every country club — the header
  reads the club's name from cc_clubs, so "Farland Country Club" is just data).
  Padel scored by the OPR engine leg, tennis by OTR's, squash by OSR's — via
  cc_submit_match -> cc_recompute_<discipline>. Reads cc_ tables ONLY.
  Lives against the OSR Supabase project ADDRESS; OSR itself is never touched.
  v1 scope: sport picker · score entry · standings · recent matches · unified
  profile (three-tile honour board) · admin (club/members/pairs/corrections).
  Ladders and tournaments intentionally excluded from v1.
-->
<style>
:root{
  --club:#1B3B2F;        /* clubhouse green */
  --club-deep:#122A21;
  --linen:#F2EDE0;       /* cream */
  --linen-2:#E9E1CE;
  --brass:#C9A44C;       /* brass accent */
  --ink:#1E2B24;
  --padel:#6C3483;       /* parent app colours — one club, three engines */
  --tennis:#2E7D4F;
  --squash:#A93226;
  --ok:#2E7D4F; --bad:#A93226;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:var(--linen);color:var(--ink);min-height:100vh}
.serif{font-family:Georgia,'Times New Roman',serif}
header{background:var(--club);color:var(--linen);padding:18px 16px 14px;text-align:center;border-bottom:3px solid var(--brass)}
header h1{font-family:Georgia,serif;font-weight:700;font-size:1.45rem;letter-spacing:.5px}
header .sub{font-size:.72rem;letter-spacing:2.5px;text-transform:uppercase;color:var(--brass);margin-top:3px}
nav{display:flex;background:var(--club-deep);position:sticky;top:0;z-index:5}
nav button{flex:1;background:none;border:none;color:#cfd8d2;padding:11px 2px;font-size:.8rem;cursor:pointer;border-bottom:3px solid transparent}
nav button.on{color:var(--linen);border-bottom-color:var(--brass);font-weight:600}
main{max-width:640px;margin:0 auto;padding:14px 12px 60px}
.card{background:#fff;border:1px solid var(--linen-2);border-radius:10px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
h2{font-family:Georgia,serif;font-size:1.05rem;margin-bottom:10px;color:var(--club)}
h3{font-size:.9rem;margin:10px 0 6px;color:var(--club)}
label{display:block;font-size:.75rem;color:#5c6b62;margin:8px 0 3px}
select,input[type=text],input[type=number],input[type=date],input[type=password]{width:100%;padding:9px;border:1px solid #cfc7b2;border-radius:7px;font-size:.95rem;background:#fff}
.row{display:flex;gap:8px}.row>*{flex:1}
button.btn{width:100%;padding:12px;border:none;border-radius:8px;background:var(--club);color:var(--linen);font-size:1rem;font-weight:600;cursor:pointer;margin-top:12px}
button.btn:disabled{opacity:.5}
button.mini{padding:6px 10px;border:1px solid #cfc7b2;background:#fff;border-radius:6px;font-size:.78rem;cursor:pointer}
.sport-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:6px}
.sport-card{border:none;border-radius:12px;padding:20px 16px;color:#fff;cursor:pointer;text-align:left;position:relative;overflow:hidden}
.sport-card .nm{font-family:Georgia,serif;font-size:1.35rem;font-weight:700}
.sport-card .eng{font-size:.7rem;letter-spacing:1.5px;text-transform:uppercase;opacity:.85;margin-top:3px}
.sport-card.padel{background:linear-gradient(135deg,var(--padel),#4A235A)}
.sport-card.tennis{background:linear-gradient(135deg,var(--tennis),#1D5433)}
.sport-card.squash{background:linear-gradient(135deg,var(--squash),#78231A)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.68rem;font-weight:700;letter-spacing:.5px;color:#fff}
.pill.padel{background:var(--padel)}.pill.tennis{background:var(--tennis)}.pill.squash{background:var(--squash)}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th{color:#5c6b62;font-weight:600;text-align:left;padding:6px 4px;border-bottom:2px solid var(--linen-2);font-size:.72rem;text-transform:uppercase;letter-spacing:.5px}
td{padding:7px 4px;border-bottom:1px solid var(--linen-2)}
tr.tap{cursor:pointer}tr.tap:active{background:var(--linen)}
.muted{color:#8a9790;font-size:.78rem}
.msg{padding:10px;border-radius:8px;font-size:.85rem;margin-top:10px;display:none}
.msg.ok{display:block;background:#E3EFE7;color:#1D5433}.msg.err{display:block;background:#F5E1DE;color:#78231A}
.board{display:grid;grid-template-columns:1fr;gap:10px;margin-top:8px}
.plaque{border-radius:10px;padding:12px 14px;color:#fff;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.plaque.padel{background:linear-gradient(135deg,var(--padel),#4A235A)}
.plaque.tennis{background:linear-gradient(135deg,var(--tennis),#1D5433)}
.plaque.squash{background:linear-gradient(135deg,var(--squash),#78231A)}
.plaque .d{font-size:.7rem;letter-spacing:1.5px;text-transform:uppercase;opacity:.85}
.plaque .r{font-family:Georgia,serif;font-size:1.5rem;font-weight:700}
.plaque .side{text-align:right;font-size:.78rem;line-height:1.5}
.mv.up{color:#B9E4C4}.mv.dn{color:#F3C1B8}
.back{background:none;border:none;color:var(--club);font-size:.85rem;cursor:pointer;padding:4px 0;margin-bottom:8px}
.delta{font-weight:700}.delta.up{color:var(--ok)}.delta.dn{color:var(--bad)}
.setline{font-size:.74rem;color:#8a9790}
.gate{margin:8px 0}
</style>
</head>
<body>
<header>
  <h1 id="clubName" class="serif">Country Club</h1>
  <div class="sub">One club · Three disciplines · One rating home</div>
  <div style="font-size:.62rem;color:#7a917f;margin-top:4px;letter-spacing:1px">v2026.08.26-18</div>
</header>
<nav id="nav">
  <button data-v="home" class="on">Home</button>
  <button data-v="profile">Profiles</button>
  <button data-v="admin">Admin</button>
</nav>
<main id="main"></main>

<script>
"use strict";
/* ================= CONFIG (CC lives at the OSR project ADDRESS only) ============ */
var SB_URL="https://djmbnvikrdgnomjhtkgf.supabase.co";
var SB_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRqbWJudmlrcmRnbm9tamh0a2dmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzOTE0MzEsImV4cCI6MjEwMDk2NzQzMX0.vR8xlVFjV6jXW-pAclGjM74HqmWSKVpsacFjM-dCIJI";
var CID=(function(){ var m=(location.search||"").match(/[?&]club=(\d+)/); return m?parseInt(m[1],10):1; })();
var DISCS=["padel","tennis","squash"];
var DLABEL={padel:"Padel",tennis:"Tennis",squash:"Squash"};
var DENGINE={padel:"OPR engine",tennis:"OTR engine",squash:"OSR engine"};

/* ================= DATA HELPERS ================= */
function rest(path){ return fetch(SB_URL+"/rest/v1/"+path,{headers:{apikey:SB_ANON,Authorization:"Bearer "+SB_ANON}}).then(function(r){return r.json();}); }
function fn(name,body){ return fetch(SB_URL+"/functions/v1/"+name,{method:"POST",headers:{apikey:SB_ANON,Authorization:"Bearer "+SB_ANON,"Content-Type":"application/json"},body:JSON.stringify(body)}).then(function(r){return r.json();}); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function lvl(r){ return (r==null)?"–":(Math.round(r/200*10)/10).toFixed(1); }
function mv(cur,init){ if(cur==null||init==null)return null; return Math.round(cur-init); }
function mvHtml(m){ if(m==null)return '<span class="muted">–</span>'; var s=m>=0?"+":""; return '<span class="mv '+(m>=0?"up":"dn")+'">'+s+m+'</span>'; }
function today(){ var d=new Date(); return d.toISOString().slice(0,10); }
function typeFromGenders(gs){ var m=0,f=0; gs.forEach(function(g){ if(g==="M")m++; else if(g==="F")f++; }); if(m>0&&f===0)return "Men's"; if(f>0&&m===0)return "Ladies"; return "Mixed"; }
function pairTypeLabel(g){ return g==="M"?"Men's":(g==="L"?"Ladies":"Mixed"); }

/* ================= STATE ================= */
var S={view:"home",disc:null,members:[],pairs:[],club:null,profName:null,profDisc:null,adminPin:"",adminOpen:false,adminClub:null,adminMaster:false,adminClubs:[]};

/* ================= BOOT ================= */
var MEMBER_PARAM=(function(){ var m=(location.search||"").match(/[?&]member=([^&]+)/); return m?decodeURIComponent(m[1]):null; })();
function boot(){
  rest("cc_clubs?id=eq."+CID+"&select=id,name").then(function(rows){
    S.club=(rows&&rows[0])||null;
    document.getElementById("clubName").textContent=S.club?S.club.name:"Country Club (club "+CID+" not found)";
  });
  if(MEMBER_PARAM){
    S.view="profile"; S.profName=MEMBER_PARAM;
    Array.prototype.forEach.call(document.querySelectorAll("#nav button"),function(x){x.classList.toggle("on",x.getAttribute("data-v")==="profile");});
    document.getElementById("main").innerHTML='<div class="card"><div class="muted">Opening profile…</div></div>';
  } else { render(); }
  loadRoster().then(function(){
    if(MEMBER_PARAM && !S.members.some(function(x){return x.full_name===MEMBER_PARAM;})){ S.view="home"; S.profName=null; }
    render();
  });
}
function loadRoster(){
  return Promise.all([
    rest("cc_individuals?club_id=eq."+CID+"&select=id,full_name,gender,seed_rating,current_rating&order=full_name"),
    rest("cc_players?club_id=eq."+CID+"&discipline=eq.padel&select=id,name,gender,member_a_id,member_b_id&order=name")
  ]).then(function(res){ S.members=res[0]||[]; S.pairs=res[1]||[]; });
}
document.getElementById("nav").addEventListener("click",function(e){
  var b=e.target.closest("button"); if(!b)return;
  S.view=b.getAttribute("data-v"); S.profName=null; S.profDisc=null;
  Array.prototype.forEach.call(document.querySelectorAll("#nav button"),function(x){x.classList.toggle("on",x===b);});
  render();
});

/* ================= RENDER ROUTER ================= */
function render(){
  var m=document.getElementById("main");
  if(S.view==="home")return vHome(m);
  if(S.view==="profile")return vProfile(m);
  if(S.view==="admin")return vAdmin(m);
}

/* ================= HOME — the sport picker ================= */
function vHome(m){
  var h='<div class="card"><h2>Select your discipline</h2><div class="sport-grid">';
  DISCS.forEach(function(d){
    h+='<div class="sport-card '+d+'" style="cursor:default">'
      +'<div class="nm">'+DLABEL[d]+'</div><div class="eng">'+DENGINE[d]+'</div>'
      +'<div style="display:flex;gap:10px;margin-top:14px">'
      +'<button onclick="goEnter(event,\''+d+'\')" style="flex:1.4;background:rgba(255,255,255,.92);color:#1B3B2F;border:none;padding:12px 8px;border-radius:9px;font-size:.95rem;font-weight:800;cursor:pointer">+ Enter Score</button>'
      +'<button onclick="goSport(\''+d+'\')" style="flex:1;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.5);padding:12px 8px;border-radius:9px;font-size:.85rem;font-weight:600;cursor:pointer">Open full app</button>'
      +'</div></div>';
  });
  h+='</div></div>';
  h+='<div class="card"><div class="muted">Register once, play everything. Every member holds one profile across all three sports — open <b>Profiles</b> to see the honour board.</div></div>';
  m.innerHTML=h;
}
function goSport(d){ location.href="cc-"+d+".html?club="+CID; }
function goEnter(ev,d){ ev.stopPropagation(); location.href="cc-"+d+".html?club="+CID+"&view=enter"; }
function goProfile(d){
  var me=S.members.find(function(x){return x.full_name===S.profName;})||{};
  location.href="cc-"+d+".html?club="+CID+"&player="+encodeURIComponent(S.profName)+"&gender="+encodeURIComponent(me.gender||"M");
}


/* ============ shared form helpers (admin) ============ */
function sel(lab,id,arr){
  var h='<label>'+lab+'</label><select id="'+id+'"><option value="">— choose —</option>';
  arr.forEach(function(n){ h+='<option>'+esc(n)+'</option>'; });
  return h+'</select>';
}
function val(id){ var e=document.getElementById(id); return e?e.value.trim():""; }
function submitScore(){
  var d=S.disc, msg=document.getElementById("emsg");
  msg.className="msg";
  var t1s=parseInt(val("t1s"),10), t2s=parseInt(val("t2s"),10);
  var t1g=parseInt(val("t1g"),10), t2g=parseInt(val("t2g"),10);
  if(isNaN(t1s)||isNaN(t2s)||isNaN(t1g)||isNaN(t2g)){ msg.className="msg err"; msg.textContent="All four score numbers are required."; return; }
  var match={ match_date:val("mdate"), event:"Social", set_scores:val("mset"),
    t1_sets:t1s, t2_sets:t2s, t1_games:t1g, t2_games:t2g };
  if(d==="padel"){
    var n1p=val("p_t1"), n1q=val("p_t1b"), n2p=val("p_t2"), n2q=val("p_t2b");
    var need4=[n1p,n1q,n2p,n2q];
    if(need4.some(function(x){return !x;})){ msg.className="msg err"; msg.textContent="Choose all four players."; return; }
    var u={}; var dup4=false; need4.forEach(function(x){ if(u[x])dup4=true; u[x]=1; });
    if(dup4){ msg.className="msg err"; msg.textContent="The same member is selected twice."; return; }
    match.t1p1=n1p; match.t1p2=n1q; match.t2p1=n2p; match.t2p2=n2q;
    match.match_format="doubles";
  } else {
    var dbl=(S.fmt==="doubles");
    var n1=val("p_t1"), n2=val("p_t2"), n1b=dbl?val("p_t1b"):null, n2b=dbl?val("p_t2b"):null;
    var need=dbl?[n1,n1b,n2,n2b]:[n1,n2];
    if(need.some(function(x){return !x;})){ msg.className="msg err"; msg.textContent="Choose all players."; return; }
    var uniq={}; var dup=false; need.forEach(function(x){ if(uniq[x])dup=true; uniq[x]=1; });
    if(dup){ msg.className="msg err"; msg.textContent="The same member is selected twice."; return; }
    match.t1p1=n1; match.t1p2=n1b; match.t2p1=n2; match.t2p2=n2b;
    match.match_format=dbl?"doubles":"singles";
    var gs=need.map(function(n){ var r=S.members.find(function(x){return x.full_name===n;}); return r?r.gender:""; });
    match.match_type=typeFromGenders(gs);
  }
  var payload={ club_id:CID, discipline:d, submitter:val("msub"), pin:"", match:match };
  msg.className="msg ok"; msg.textContent="Saving…";
  fn("cc_submit_match",payload).then(function(r){
    if(r&&r.ok){ msg.className="msg ok"; msg.textContent="Match saved — ratings are rebuilding now."; }
    else { msg.className="msg err"; msg.textContent=(r&&r.error)||"Could not save."; }
  }).catch(function(e){ msg.className="msg err"; msg.textContent=String(e); });
}
/* ================= PROFILES — the honour board ================= */
function vProfile(m){
  if(S.profName)return vProfileBoard(m);
  var h='<div class="card"><h2>Member profiles</h2>';
  if(!S.members.length){ h+='<div class="muted">No members registered yet — Admin → Bulk add members.</div></div>'; m.innerHTML=h; return; }
  h+='<div style="position:sticky;top:46px;background:#fff;padding:4px 0 8px;z-index:3"><label>Search members</label><input type="text" id="pSearch" placeholder="Start typing a name…" oninput="filterProfiles()" autocomplete="off"></div>';
  h+='<div id="pList"></div></div>';
  m.innerHTML=h;
  filterProfiles();
  var pi=document.getElementById("pSearch"); if(pi) pi.focus();
}
function filterProfiles(){
  var q=(val("pSearch")||"").toLowerCase();
  var rows=S.members.filter(function(r){ return !q || r.full_name.toLowerCase().indexOf(q)>=0; });
  var el=document.getElementById("pList"); if(!el)return;
  if(!rows.length){ el.innerHTML='<div class="muted" style="margin-top:8px">No members match.</div>'; return; }
  var h='<table><tr><th>Member</th><th></th></tr>';
  rows.forEach(function(r){
    h+='<tr class="tap" onclick="openProfile(\''+esc(r.full_name).replace(/'/g,"\\'")+'\')"><td>'+esc(r.full_name)+'</td><td class="muted">view ›</td></tr>';
  });
  h+='</table>';
  el.innerHTML=h;
}
function openProfile(nm){ S.profName=nm; S.profDisc=null; render(); }
function backToList(){ S.profName=null; S.profDisc=null; render(); }

function vProfileBoard(m){
  var nm=S.profName;
  var me=S.members.find(function(x){return x.full_name===nm;})||{};
  m.innerHTML='<button class="back" onclick="backToList()">‹ All members</button>'
    +'<div class="card"><h2 class="serif">'+esc(nm)+'</h2><div class="muted">The honour board — one member, three disciplines. Tap a plaque to open that sport\'s full app for the complete profile.</div>'
    +'<div class="board" id="board">Loading…</div></div>';
  // ONE SYSTEM, THREE SPORTS: every plaque reads the engine-written
  // cc_player_results rows — padel included (the OPR engine writes
  // per-individual rows there too; it is what the padel replica's own
  // profile header shows). Individuals present but unrated fall back
  // to their register rating with move 0.
  Promise.all([
    rest("cc_individuals?club_id=eq."+CID+"&select=id,full_name,seed_rating"),
    rest("cc_players?club_id=eq."+CID+"&discipline=eq.padel&select=name,member_a_id,member_b_id"),
    rest("cc_matches?club_id=eq."+CID+"&discipline=eq.padel&select=t1p1,t2p1,rating_delta&order=match_date.asc,id.asc"),
    rest("cc_player_results?club_id=eq."+CID+"&discipline=eq.tennis&select=name,current_rating,initial_rating&order=current_rating.desc"),
    rest("cc_player_results?club_id=eq."+CID+"&discipline=eq.squash&select=name,current_rating,initial_rating&order=current_rating.desc")
  ]).then(function(rr){
    var rows=[{d:"padel"},{d:"tennis"},{d:"squash"}];
    // PADEL — the family's v44 single-source replay: seed + own per-match deltas,
    // pair sides expanded to their two members via the member links.
    (function(){
      var inds=rr[0]||[], pairs=rr[1]||[], ms=rr[2]||[];
      var seed={}, idName={};
      inds.forEach(function(i){ seed[i.full_name]=(i.seed_rating!=null?+i.seed_rating:1500); idName[i.id]=i.full_name; });
      var members={};
      pairs.forEach(function(p2){ if(p2.member_a_id!=null&&p2.member_b_id!=null){ var a=idName[p2.member_a_id], b=idName[p2.member_b_id]; if(a&&b) members[p2.name]=[a,b]; } });
      var cur={}; Object.keys(seed).forEach(function(k){ cur[k]=seed[k]; });
      var membersOf=function(pn){ return members[pn]||[pn]; };
      ms.forEach(function(m2){ var d=(m2.rating_delta!=null?+m2.rating_delta:0);
        membersOf(m2.t1p1).forEach(function(x){ if(x in cur) cur[x]+=d; });
        membersOf(m2.t2p1).forEach(function(x){ if(x in cur) cur[x]-=d; }); });
      var list=Object.keys(cur).map(function(k){ return {name:k, r:Math.round(cur[k])}; })
        .sort(function(a,b){ return b.r-a.r; });
      var row=rows[0]; row.n=list.length;
      list.forEach(function(r,idx){ if(r.name===nm){ row.rank=idx+1; row.cur=r.r; row.move=Math.round(r.r-(seed[nm]!=null?seed[nm]:r.r)); } });
      if(row.cur==null){ row.cur=(me.seed_rating!=null)?me.seed_rating:null; row.move=(row.cur!=null)?0:null; }
    })();
    // TENNIS / SQUASH — engine-written per-player results, as before.
    [["tennis",rr[3]||[]],["squash",rr[4]||[]]].forEach(function(pr2,ix){
      var list=pr2[1].filter(function(r){ return String(r.name).indexOf(" & ")<0; });
      var row=rows[ix+1];
      var meR=null;
      list.forEach(function(r,idx){ if(r.name===nm){ meR=r; row.rank=idx+1; } });
      row.n=list.length;
      if(meR){ row.cur=meR.current_rating; row.move=mv(meR.current_rating,meR.initial_rating); }
      else { row.cur=(me.seed_rating!=null)?me.seed_rating:null; row.move=(row.cur!=null)?0:null; row.rank=null; }
    });
    (function(){
      var h="";
      rows.forEach(function(r){
        var cur=(r.cur!=null)?Math.round(r.cur):"–";
        var rk=(r.rank!=null)?("rank "+r.rank+" / "+r.n):"unranked";
        h+='<div class="plaque '+r.d+'" onclick="goProfile(\''+r.d+'\')">'
          +'<div><div class="d">'+DLABEL[r.d]+'</div><div class="r">'+cur+'</div></div>'
          +'<div class="side">level '+lvl(r.cur)+'<br>move '+mvHtml(r.move)+'<br>'+rk+' ›</div></div>';
      });
      document.getElementById("board").innerHTML=h;
    })();
  });
}

/* ================= ADMIN ================= */
function vAdmin(m){
  if(!S.adminOpen){
    m.innerHTML='<div class="card"><h2>Admin</h2>'
      +'<label>Admin PIN</label><input type="password" id="aPin" inputmode="numeric">'
      +'<button class="btn" onclick="aUnlock()">Open admin</button>'
      +'<div class="muted" style="margin-top:6px">Your club code opens your club\'s admin. The master code opens every club.</div>'
      +'<div class="msg" id="aGateMsg"></div></div>';
    return;
  }
  var here=S.adminClub?S.adminClub.name:"";
  var h='<div class="card"><h2>Admin — '+esc(here)+'</h2>'
    +'<div class="row"><div class="muted">'+(S.adminMaster?"Master access":"Club admin access")+'</div>'
    +'<div style="text-align:right"><button class="mini" onclick="aLock()">Close admin</button></div></div>';
  if(S.adminMaster && S.adminClubs.length>1){
    h+='<label>Administering club</label><select id="aClubSel" onchange="aSwitchClub()">';
    S.adminClubs.forEach(function(c){ h+='<option value="'+c.id+'"'+((S.adminClub&&S.adminClub.id===c.id)?" selected":"")+'>'+esc(c.name)+' (#'+c.id+')</option>'; });
    h+='</select>';
  }
  h+='</div>';
  h+='<div class="card"><h3>Sport control rooms</h3>'
    +'<div class="muted">Members, pairs, tournaments and match corrections live inside each sport\'s own Control Room (its Admin tab) — the same proven admin as the standalone apps.</div>'
    +'<div class="row" style="margin-top:8px">'
    +'<button class="mini" style="padding:10px" onclick="goSport(\'padel\')">Padel</button>'
    +'<button class="mini" style="padding:10px" onclick="goSport(\'tennis\')">Tennis</button>'
    +'<button class="mini" style="padding:10px" onclick="goSport(\'squash\')">Squash</button>'
    +'</div></div>';
  h+='<div class="card"><h3>Bulk add members (paste from Excel)</h3>'
    +'<div class="muted">One member per line: Name, Gender, Rating (comma or tab separated). Gender M or F required; Rating blank = 1500/1300.</div>'
    +'<textarea id="aBulk" style="width:100%;min-height:140px;font-family:monospace;font-size:12px;border:1px solid #cfc7b2;border-radius:7px;padding:9px;margin-top:8px" placeholder="John Smith, M, 1350\nSarah Jones, F, 1180\nMike Brown\tM\t1420"></textarea>'
    +'<button class="btn" onclick="aBulkAdd()">Add all pasted members</button>'
    +'<div class="msg" id="aMsgB"></div></div>';
  h+='<div class="card"><h3>Rebuild ratings</h3>'
    +'<div class="muted">Replays every match of that discipline from the register ratings — safe to run any time.</div>'
    +'<div class="row" style="margin-top:8px">'
    +'<button class="mini" style="padding:10px" onclick="aRebuild(\'padel\')">Padel</button>'
    +'<button class="mini" style="padding:10px" onclick="aRebuild(\'tennis\')">Tennis</button>'
    +'<button class="mini" style="padding:10px" onclick="aRebuild(\'squash\')">Squash</button>'
    +'</div><div class="msg" id="aMsgR"></div></div>';
  h+='<div class="card"><h3>Clubs (master)</h3>'
    +'<label>New club name</label><input type="text" id="aCn">'
    +'<label>Its admin PIN</label><input type="text" id="aCp">'
    +'<button class="btn" onclick="aAddClub()">Create club</button>'
    +'<div class="msg" id="aMsg4"></div></div>';
  m.innerHTML=h;
}
function apin(){ return S.adminPin; }
function aUnlock(){
  var p=val("aPin"); var msg=document.getElementById("aGateMsg");
  if(!p){ msg.className="msg err"; msg.textContent="Enter a PIN."; return; }
  msg.className="msg ok"; msg.textContent="Checking…";
  fn("cc_admin",{action:"list_clubs"}).then(function(r){
    var clubs=(r&&r.clubs)||[];
    // probe the PIN against THIS club first, then every club (a club code
    // identifies its club; the master passes everywhere).
    var probeIds=[CID].concat(clubs.map(function(c){return c.id;}).filter(function(i){return i!==CID;}));
    var i=0;
    function tryNext(){
      if(i>=probeIds.length){ msg.className="msg err"; msg.textContent="PIN not recognised."; return; }
      var id=probeIds[i++];
      fn("cc_admin",{action:"edit_member",club_id:id,admin_pin:p,full_name:"__pin_probe__"}).then(function(rr){
        var e=(rr&&rr.error)||"";
        if(e==="Admin PIN required."){ tryNext(); return; }
        // PIN accepted for this club (any other response passed the gate)
        S.adminPin=p; S.adminOpen=true; S.adminClubs=clubs;
        S.adminClub=clubs.find(function(c){return c.id===id;})||{id:id,name:"Club #"+id};
        // master detection: PIN passes for a SECOND club too (or only one club exists
        // and the probe passed while it is not that club's own stored code — safe
        // fallback: try one other club if present)
        var other=clubs.find(function(c){return c.id!==id;});
        if(other){
          fn("cc_admin",{action:"edit_member",club_id:other.id,admin_pin:p,full_name:"__pin_probe__"}).then(function(r2){
            S.adminMaster=((r2&&r2.error)||"")!=="Admin PIN required.";
            if(!S.adminMaster){ S.adminClubs=[S.adminClub]; }
            afterUnlock();
          });
        } else { S.adminMaster=true; afterUnlock(); }
      });
    }
    tryNext();
  });
}
function afterUnlock(){
  if(S.adminClub && S.adminClub.id!==CID){
    // the PIN belongs to a different club than the page URL — follow the PIN
    location.search="?club="+S.adminClub.id;
    return;
  }
  render();
}
function aSwitchClub(){
  var id=parseInt(val("aClubSel"),10);
  if(id && (!S.adminClub||id!==S.adminClub.id)){ location.search="?club="+id; }
}
function aLock(){ S.adminOpen=false; S.adminPin=""; S.adminMaster=false; render(); }
function aBulkAdd(){
  var msg=document.getElementById("aMsgB"); msg.className="msg";
  var raw=val("aBulk");
  var lines=raw.split("\n").map(function(l){return l.trim();}).filter(function(l){return l.length;});
  if(!lines.length){ msg.className="msg err"; msg.textContent="Nothing to add — paste some rows first."; return; }
  var rows=[], errs=[];
  lines.forEach(function(ln,i){
    var parts=ln.split(/\t|,/).map(function(p){return p.trim();}).filter(function(p){return p!=="";});
    if(parts.length<2){ errs.push("Line "+(i+1)+": need at least Name, Gender."); return; }
    var name=parts[0], gender=(parts[1]||"").toUpperCase().charAt(0), rating=parts[2];
    if(gender!=="M"&&gender!=="F"){ errs.push("Line "+(i+1)+" ("+name+"): gender must be M or F."); return; }
    rows.push({ full_name:name, gender:gender, rating:rating||null });
  });
  if(errs.length){ msg.className="msg err"; msg.innerHTML=errs.map(esc).join("<br>"); return; }
  msg.className="msg ok"; msg.textContent="Adding "+rows.length+" members…";
  fn("cc_admin",{action:"bulk_add_members",club_id:CID,admin_pin:apin(),rows:rows}).then(function(r){
    if(r&&r.ok){
      var t="Added "+r.added+" member"+(r.added===1?"":"s")+".";
      if(r.failed&&r.failed.length){ msg.className="msg err"; msg.textContent=t+" Failed: "+r.failed.join(", "); }
      else { msg.className="msg ok"; msg.textContent=t; document.getElementById("aBulk").value=""; }
      loadRoster().then(render);
    } else { msg.className="msg err"; msg.textContent=(r&&r.error)||"Failed."; }
  });
}
function aRebuild(d){
  var msg=document.getElementById("aMsgR"); msg.className="msg ok"; msg.textContent="Rebuilding "+d+" ratings…";
  fn("cc_recompute_"+d,{club_id:CID}).then(function(r){
    if(r&&(r.ok||r.processed!=null||r.players!=null||!r.error)){ msg.className="msg ok"; msg.textContent=DLABEL[d]+" ratings rebuilt — refresh Profiles to see the board update."; loadRoster(); }
    else { msg.className="msg err"; msg.textContent=(r&&r.error)||"Rebuild failed."; }
  }).catch(function(e){ msg.className="msg err"; msg.textContent=String(e); });
}
function aAddClub(){
  var msg=document.getElementById("aMsg4"); msg.className="msg ok"; msg.textContent="Working…";
  fn("cc_admin",{action:"add_club",admin_pin:apin(),name:val("aCn"),club_admin_pin:val("aCp")}).then(function(r){
    if(r&&r.ok){ msg.className="msg ok"; msg.textContent="Created club #"+r.club.id+" — open with ?club="+r.club.id; }
    else { msg.className="msg err"; msg.textContent=(r&&r.error)||"Failed."; }
  });
}

boot();
</script>
